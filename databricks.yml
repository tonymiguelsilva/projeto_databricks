# Projeto Farol · Torre de Controle da Vértice Tecnologia.
bundle:
  name: vertice

include:
  - resources/*.yml

sync:
  exclude:
    - minha-torre/**

variables:
  catalog:
    description: Catálogo Unity Catalog do Projeto Vértice
    default: lakehouse_vertice
  warehouse_id:
    description: SQL Warehouse serverless usado pelas tarefas SQL
    default: a25e41e310648f85
  s3_endpoint:
    description: Endpoint S3 do Supabase Storage
  s3_regiao:
    description: Região S3 do Supabase Storage
  s3_bucket:
    description: Nome exato do bucket no Supabase Storage
  s3_access_key_id:
    description: Access Key ID do Supabase; definido apenas no override local
  s3_secret_access_key:
    description: Secret Access Key do Supabase; definido apenas no override local

targets:
  dev:
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-d9922c6a-e0c3.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-d9922c6a-e0c3.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
