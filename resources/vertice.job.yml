resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      description: Ingestão, conferência da bronze e transformação silver do Projeto Vértice.
      performance_target: STANDARD
      max_concurrent_runs: 1
      tags:
        projeto: vertice
        camada: medallion
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Sao_Paulo
      environments:
        - environment_key: padrao
          spec:
            environment_version: "5"
            dependencies:
              - boto3==1.40.18
              - requests==2.32.5
      tasks:
        - task_key: ingestao_feriados
          environment_key: padrao
          notebook_task:
            notebook_path: ../src/ingestao/01_ingestao_api.py

        - task_key: ingestao_data_lake
          environment_key: padrao
          notebook_task:
            notebook_path: ../src/ingestao/02_ingestao_boto3.py
            base_parameters:
              S3_ENDPOINT: ${var.s3_endpoint}
              AWS_DEFAULT_REGION: ${var.s3_regiao}
              S3_BUCKET: ${var.s3_bucket}
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}

        - task_key: conferencia_bronze
          depends_on:
            - task_key: ingestao_feriados
            - task_key: ingestao_data_lake
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql

        - task_key: medalhao
          depends_on:
            - task_key: conferencia_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}
